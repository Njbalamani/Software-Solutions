{% extends "base.html" %}
{% block title %}Check your email — {{ site.site_name }}{% endblock %}
{% block content %}
<section class="auth-section">
  <div class="auth-card reveal">
    <div class="success-icon">✓</div>
    <h1>Check your email</h1>
    <p class="muted-text">If an account exists with that address, a password reset link has been sent.</p>
    <div class="auth-links"><a href="{% url 'accounts:login' %}">&larr; Back to login</a></div>
  </div>
</section>
{% endblock %}
