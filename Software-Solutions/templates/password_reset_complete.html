{% extends "base.html" %}
{% block title %}Password reset complete — {{ site.site_name }}{% endblock %}
{% block content %}
<section class="auth-section">
  <div class="auth-card reveal">
    <div class="success-icon">✓</div>
    <h1>Password reset complete</h1>
    <p class="muted-text">Your password has been changed. You can now log in with your new password.</p>
    <a href="{% url 'accounts:login' %}" class="btn btn-primary btn-block">Log in</a>
  </div>
</section>
{% endblock %}
