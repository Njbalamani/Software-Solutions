{% extends "base.html" %}
{% block title %}Access denied — {{ site.site_name }}{% endblock %}
{% block content %}
<section class="error-section">
  <div class="reveal">
    <div class="error-code">403</div>
    <h1>Access denied</h1>
    <p>You don't have permission to view this page.</p>
    <div class="hero-actions"><a href="{% url 'core:home' %}" class="btn btn-primary">Back to home</a>{% if user.is_authenticated %}<a href="{% url 'accounts:account' %}" class="btn btn-outline">My account</a>{% endif %}</div>
  </div>
</section>
{% endblock %}
