{% extends "base.html" %}
{% block title %}Server error — {{ site.site_name }}{% endblock %}
{% block content %}
<section class="error-section">
  <div class="reveal">
    <div class="error-code">500</div>
    <h1>Something went wrong</h1>
    <p>An unexpected error occurred. Please try again shortly.</p>
    <div class="hero-actions"><a href="{% url 'core:home' %}" class="btn btn-primary">Back to home</a></div>
  </div>
</section>
{% endblock %}
